name: ccp_app
description: A multi-platform Flutter application

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Routing
  go_router: ^12.1.1
  
  # HTTP Client
  dio: ^5.3.2
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # UI
  cupertino_icons: ^1.0.2

   # WebView
  webview_flutter: ^4.4.2

   # Location tracking dependencies
  geolocator: ^11.0.0  # For GPS location tracking
  intl: ^0.19.0 
  permission_handler: ^11.3.0
  flutter_foreground_task: ^8.0.0

  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  uuid: ^4.3.3
  # Device Information
  device_info_plus: ^10.1.0
  android_intent_plus: ^4.0.3
  camera: ^0.10.5+9          # front camera capture
  path_provider: ^2.1.2      # getApplicationDocumentsDirectory()
  path: ^1.9.0               # p.join() for file paths

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  